packages:
  - '.'
allowBuilds:
  # context-mode 依赖 better-sqlite3（FTS5 知识库）原生二进制，需放行其构建脚本，
  # 否则语义检索（ctx_search / ctx_index）不可用。见 docs/references/deployment.md。
  '@mxalbert/context-mode': true
  better-sqlite3: true
  # esbuild 自带原生二进制（平台相关 optionalDependencies），放行其安装脚本。
  esbuild: true
minimumReleaseAgeExclude:
  - '@mxalbert/context-mode@2.0.4'
